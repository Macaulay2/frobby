name: Website
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get install -y texlive-latex-base doxygen pandoc
      - name: Build website
        run: |
          mkdir -p build/autotools
          cd build/autotools
          ../../autogen.sh
          ../../configure
          make website
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/autotools/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
