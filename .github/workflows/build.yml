name: Build
on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build-system:
          - autotools
          - cmake
        os:
          - macos-latest
          - ubuntu-latest
        debug:
          - 'no'
          - 'yes'
        exclude:
          - build-system: cmake
            debug: 'yes'
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        if: matrix.build-system == 'autotools'
        run: |
          if test ${{ matrix.os }} = macos-latest
          then brew install autoconf automake libtool
          else sudo apt-get install -y texlive-latex-base doxygen \
                 texlive-latex-recommended texlive-latex-extra graphviz
          fi
      - name: Set up environment
        run: |
          if test ${{ matrix.os }} = macos-latest
          then echo "CPPFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
               echo "LDFLAGS=-L$(brew --prefix)/lib"      >> $GITHUB_ENV
          fi
      - name: Build frobby
        run: |
          if test ${{ matrix.build-system }} = autotools
          then mkdir -p build/autotools
               cd build/autotools
               ../../autogen.sh
               ../../configure --enable-debug=${{ matrix.debug }}
               make -j4
          else mkdir -p build/cmake
               cd build/cmake
               cmake -B. -S../.. -GNinja
               ninja
          fi
      - name: Check frobby
        if: matrix.build-system == 'autotools'
        run: |
          cd build/autotools
          make -j4 check TEST_LEVEL=full VERBOSE=1
      - name: Check distribution and installation
        if: >-
          matrix.build-system == 'autotools' && matrix.os == 'ubuntu-latest'
          && matrix.debug == 'no'
        run: |
          cd build/autotools
          make -j4 distcheck
      - name: Build documentation
        if: >-
          matrix.build-system == 'autotools' && matrix.os == 'ubuntu-latest'
          && matrix.debug == 'no'
        run: |
          cd build/autotools
          make doc
          make doxygen-pdf
